<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentia Connect</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
      function AgentiaConnect() {
        const [activeTab, setActiveTab] = React.useState('demo_generator');
        const [demoProspect, setDemoProspect] = React.useState({
          businessName: 'Clínica Dental Sonrisas',
          industry: 'Salud y Estética Dental',
          phone: '+56 9 4444 5555',
        });
        const [isRecording, setIsRecording] = React.useState(false);
        const [voiceLogs, setVoiceLogs] = React.useState([
          { speaker: 'system', text: 'Esperando interacción por voz del cliente en el widget web...' }
        ]);

        const simulateVoiceInteraction = () => {
          setIsRecording(true);
          setVoiceLogs(prev => [...prev, { speaker: 'user', text: '🎤 [Cliente hablando por voz en la web]: "Hola, necesito agendar una limpieza dental."' }]);
          setTimeout(() => {
            setIsRecording(false);
            setVoiceLogs(prev => [
              ...prev, 
              { speaker: 'ai', text: `🤖 [Agente de Voz IA]: "¡Hola! Con gusto te agendo para mañana a las 16:00 hrs."` },
              { speaker: 'whatsapp', text: `📱 [WhatsApp enviado a ${demoProspect.phone}]: "✅ ¡Cita confirmada en ${demoProspect.businessName}!"` }
            ]);
          }, 2000);
        };

        return (
          <div className="flex h-screen bg-slate-950 text-slate-100 overflow-hidden">
            <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between hidden md:flex">
              <div>
                <div className="p-6 border-b border-slate-800 flex items-center space-x-3">
                  <div className="bg-indigo-600 p-2 rounded-xl text-white font-black text-xl shadow-lg">AC</div>
                  <div>
                    <h1 className="font-bold text-lg text-white">Agentia Connect</h1>
                    <p className="text-xs text-indigo-400 font-medium">SaaS White-Label</p>
                  </div>
                </div>
                <nav className="p-4 space-y-1.5">
                  <button onClick={() => setActiveTab('demo_generator')} className={`w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium ${activeTab === 'demo_generator' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                    <span>🚀 Demo Express (Ventas)</span>
                  </button>
                  <button onClick={() => setActiveTab('voice_demo')} className={`w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium ${activeTab === 'voice_demo' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                    <span>🎙️ Demo Agente de Voz</span>
                  </button>
                </nav>
              </div>
            </aside>

            <main className="flex-1 flex flex-col overflow-y-auto p-6 bg-slate-950">
              <header className="mb-6 flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
                <div>
                  <span className="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full font-semibold border border-emerald-500/30">Modo Cierre de Venta en Vivo</span>
                  <h2 className="text-xl font-bold text-white mt-2">Plataforma Activa: {demoProspect.businessName}</h2>
                </div>
              </header>

              {activeTab === 'demo_generator' && (
                <div className="space-y-6 max-w-3xl mx-auto w-full">
                  <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4">
                    <h3 className="font-bold text-white text-lg">Datos del Negocio del Prospecto</h3>
                    <div>
                      <label className="text-xs text-slate-400 font-semibold uppercase">Nombre del Negocio</label>
                      <input 
                        type="text" 
                        value={demoProspect.businessName}
                        onChange={e => setDemoProspect({...demoProspect, businessName: e.target.value})}
                        className="w-full mt-2 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 font-semibold"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400 font-semibold uppercase">Teléfono WhatsApp</label>
                      <input 
                        type="text" 
                        value={demoProspect.phone}
                        onChange={e => setDemoProspect({...demoProspect, phone: e.target.value})}
                        className="w-full mt-2 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                    <button 
                      onClick={() => setActiveTab('voice_demo')}
                      className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-sm shadow-lg transition mt-4"
                    >
                      Ir a Probar Agente de Voz 🎙️
                    </button>
                  </div>
                </div>
              )}

              {activeTab === 'voice_demo' && (
                <div className="space-y-6 max-w-3xl mx-auto w-full text-center">
                  <div className="bg-slate-900 border border-slate-800 p-8 rounded-2xl space-y-6">
                    <h3 className="text-xl font-bold text-white">Agente de Voz Web en Vivo</h3>
                    <div className={`w-24 h-24 mx-auto rounded-full flex items-center justify-center ${isRecording ? 'bg-red-600 animate-pulse' : 'bg-indigo-600'}`}>
                      🎙️
                    </div>
                    <button 
                      onClick={simulateVoiceInteraction}
                      disabled={isRecording}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-bold text-sm shadow-lg transition"
                    >
                      {isRecording ? "Simulando conversación..." : "Simular Llamada de Voz"}
                    </button>
                    <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 text-left space-y-2">
                      {voiceLogs.map((log, index) => (
                        <div key={index} className="p-2 rounded text-xs bg-slate-900 text-indigo-300 border border-slate-800">
                          {log.text}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>
        );
      }

      ReactDOM.render(<AgentiaConnect />, document.getElementById('root'));
    </script>
  </body>
</html>
