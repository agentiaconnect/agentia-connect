<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentia Connect</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
      function AgentiaConnect() {
        const [activeTab, setActiveTab] = React.useState('demo_generator');
        
        const [demoProspect, setDemoProspect] = React.useState({
          businessName: 'Clínica Dental Sonrisas',
          industry: 'Salud y Estética Dental',
          phone: '+56 9 4444 5555',
          packageType: 'full', 
        });

        const [demoToggles, setDemoToggles] = React.useState({
          aiAgent: true,
          voiceAgent: true,
          reminders: true,
          winback: true,
          birthday: true,
          callback: true,
          reviews: true,
          mapReplies: true,
        });

        const [selectedSubAccount, setSelectedSubAccount] = React.useState('Dental Studio Pro');
        const [isAiPaused, setIsAiPaused] = React.useState(false);
        const [chatInput, setChatInput] = React.useState('');
        const [messages, setMessages] = React.useState([
          { sender: 'ai', text: `¡Hola! Bienvenido a Clínica Dental Sonrisas. ¿En qué podemos ayudarte hoy?`, time: '10:00 AM' }
        ]);

        const [isRecording, setIsRecording] = React.useState(false);
        const [voiceLogs, setVoiceLogs] = React.useState([
          { speaker: 'system', text: 'Esperando interacción por voz del cliente en el widget web...' }
        ]);

        const handleSendMessage = (e) => {
          e.preventDefault();
          if (!chatInput.trim()) return;

          const newMsgs = [...messages, { sender: 'user', text: chatInput, time: '10:05 AM' }];
          setMessages(newMsgs);
          setChatInput('');

          setTimeout(() => {
            if (!isAiPaused) {
              setMessages(prev => [...prev, { 
                sender: 'ai', 
                text: `[Asistente IA - ${demoProspect.businessName}]: Entendido. He registrado tu solicitud, verificado el calendario y enviado la confirmación a tu WhatsApp.`, 
                time: '10:05 AM' 
              }]);
            }
          }, 1000);
        };

        const simulateVoiceInteraction = () => {
          setIsRecording(true);
          setVoiceLogs(prev => [...prev, { speaker: 'user', text: '🎤 [Cliente hablando por voz en la web]: "Hola, necesito agendar una limpieza dental para mañana en la tarde."' }]);
          
          setTimeout(() => {
            setIsRecording(false);
            setVoiceLogs(prev => [
              ...prev, 
              { speaker: 'ai', text: `🤖 [Agente de Voz IA]: "¡Hola! Con gusto te agendo para mañana a las 16:00 hrs. ¿Te confirmo la cita?"` },
              { speaker: 'whatsapp', text: `📱 [WhatsApp Automático enviado a ${demoProspect.phone}]: "✅ ¡Cita confirmada en ${demoProspect.businessName}! Mañana a las 16:00 hrs."` }
            ]);
          }, 2500);
        };

        const handleApplyPreset = (type) => {
          if (type === 'full') {
            setDemoToggles({
              aiAgent: true,
              voiceAgent: true,
              reminders: true,
              winback: true,
              birthday: true,
              callback: true,
              reviews: true,
              mapReplies: true,
            });
            setDemoProspect(prev => ({ ...prev, packageType: 'full' }));
          } else {
            setDemoToggles({
              aiAgent: true,
              voiceAgent: false,
              reminders: true,
              winback: false,
              birthday: false,
              callback: false,
              reviews: true,
              mapReplies: false,
            });
            setDemoProspect(prev => ({ ...prev, packageType: 'custom' }));
          }
        };

        return (
          <div className="flex h-screen bg-slate-950 text-slate-100 font-sans overflow-hidden">
            
            {/* SIDEBAR */}
            <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between hidden lg:flex">
              <div>
                <div className="p-6 border-b border-slate-800 flex items-center space-x-3">
                  <div className="bg-indigo-600 p-2 rounded-xl text-white font-black text-xl shadow-lg">
                    AC
                  </div>
                  <div>
                    <h1 className="font-bold text-lg tracking-wide text-white">Agentia Connect</h1>
                    <p className="text-xs text-indigo-400 font-medium">SaaS White-Label Agency</p>
                  </div>
                </div>

                <nav className="p-4 space-y-1.5 overflow-y-auto max-h-[calc(100vh-140px)]">
                  {[
                    { id: 'demo_generator', label: '🚀 Demo Express (Ventas)' },
                    { id: 'voice_demo', label: '🎙️ Demo Agente de Voz Web' },
                    { id: 'dashboard', label: 'Super Admin / MRR' },
                    { id: 'subaccounts', label: 'Clientes / Subcuentas' },
                    { id: 'agents', label: 'Constructor Agentes IA' },
                    { id: 'advanced_agents', label: 'Agentes Especiales IA' },
                    { id: 'kanban', label: 'Embudos Comerciales' },
                    { id: 'calendar', label: 'Calendarios & Turnos' },
                    { id: 'inbox', label: 'Inbox & WhatsApp' },
                    { id: 'webbuilder', label: 'Landing Pages & IA' },
                    { id: 'whatsapp_api', label: 'Conexión WhatsApp QR' },
                    { id: 'domains', label: 'Dominios & SSL' },
                  ].map(item => (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${
                        activeTab === item.id 
                          ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' 
                          : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                      }`}
                    >
                      <span>{item.label}</span>
                    </button>
                  ))}
                </nav>
              </div>

              <div className="p-4 border-t border-slate-800">
                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                  <p className="text-xs text-slate-400">Prospecto en Reunión:</p>
                  <p className="text-sm font-bold text-indigo-300 truncate">{demoProspect.businessName}</p>
                </div>
              </div>
            </aside>

            {/* MAIN CONTENT AREA */}
            <main className="flex-1 flex flex-col overflow-hidden bg-slate-950">
              
              {/* HEADER */}
              <header className="h-16 bg-slate-900 border-b border-slate-800 px-6 flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <span className="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full font-semibold border border-emerald-500/30">
                    Modo Cierre de Venta
                  </span>
                  <span className="text-sm text-slate-400 hidden sm:inline">|</span>
                  <span className="text-sm font-medium text-slate-300 truncate">Prospecto: <strong className="text-white">{demoProspect.businessName}</strong></span>
                </div>
                <div className="flex items-center space-x-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span className="text-xs font-medium text-slate-200">OpenRouter Conectado</span>
                </div>
              </header>

              {/* SELECTOR MÓVIL DE PESTAÑAS (Para navegar cómodo desde el celu) */}
              <div className="bg-slate-900 border-b border-slate-800 p-3 lg:hidden overflow-x-auto flex space-x-2">
                {[
                  { id: 'demo_generator', label: '🚀 Demo' },
                  { id: 'voice_demo', label: '🎙️ Voz' },
                  { id: 'dashboard', label: '📊 Admin' },
                  { id: 'subaccounts', label: '👥 Clientes' },
                  { id: 'agents', label: '🤖 IA' },
                  { id: 'kanban', label: '📋 Kanban' },
                  { id: 'inbox', label: '💬 Inbox' },
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === item.id ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300'}`}
                  >
                    {item.label}
                  </button>
                ))}
              </div>

              {/* TAB VIEWS */}
              <div className="flex-1 overflow-y-auto p-6">

                {/* SECCIÓN: DEMO EXPRESS */}
                {activeTab === 'demo_generator' && (
                  <div className="space-y-6 max-w-5xl mx-auto">
                    <div className="bg-gradient-to-r from-indigo-900/50 via-slate-900 to-slate-900 border border-indigo-500/30 p-6 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                      <div>
                        <h2 className="text-xl md:text-2xl font-bold text-white">Demo Express para Reunión de Ventas</h2>
                        <p className="text-sm text-slate-300 mt-1">Configura los datos del negocio en segundos para tu prospecto.</p>
                      </div>
                      <button onClick={() => setActiveTab('voice_demo')} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-lg transition">
                        Probar Agente de Voz 🎙️
                      </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4">
                        <h3 className="font-bold text-white text-lg">1. Datos del Negocio del Prospecto</h3>
                        <div>
                          <label className="text-xs text-slate-400 font-semibold uppercase">Nombre del Negocio</label>
                          <input 
                            type="text" 
                            value={demoProspect.businessName}
                            onChange={e => setDemoProspect({...demoProspect, businessName: e.target.value})}
                            className="w-full mt-2 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 font-semibold"
                          />
                        </div>
                        <div>
                          <label className="text-xs text-slate-400 font-semibold uppercase">Industria / Giro</label>
                          <input 
                            type="text" 
                            value={demoProspect.industry}
                            onChange={e => setDemoProspect({...demoProspect, industry: e.target.value})}
                            className="w-full mt-2 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                          />
                        </div>
                        <div>
                          <label className="text-xs text-slate-400 font-semibold uppercase">Número de WhatsApp Business</label>
                          <input 
                            type="text" 
                            value={demoProspect.phone}
                            onChange={e => setDemoProspect({...demoProspect, phone: e.target.value})}
                            className="w-full mt-2 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                          />
                        </div>
                        <div className="pt-2">
                          <label className="text-xs text-slate-400 font-semibold uppercase block mb-2">Paquete Comercial</label>
                          <div className="grid grid-cols-2 gap-3">
                            <button 
                              onClick={() => handleApplyPreset('full')}
                              className={`p-3 rounded-xl border text-xs font-bold transition ${demoProspect.packageType === 'full' ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-950 border-slate-800 text-slate-300'}`}
                            >
                              🌟 Paquete Completo
                            </button>
                            <button 
                              onClick={() => handleApplyPreset('custom')}
                              className={`p-3 rounded-xl border text-xs font-bold transition ${demoProspect.packageType === 'custom' ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-950 border-slate-800 text-slate-300'}`}
                            >
                              ⚡ Paquete Esencial
                            </button>
                          </div>
                        </div>
                      </div>

                      <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4 flex flex-col justify-between">
                        <div>
                          <h3 className="font-bold text-white text-lg mb-3">2. Funciones Activas para la Demo</h3>
                          <div className="space-y-2.5">
                            {[
                              { key: 'aiAgent', label: '🤖 Agente de IA para WhatsApp & Web' },
                              { key: 'voiceAgent', label: '🎙️ Agente de Voz IA en Widget Web' },
                              { key: 'reminders', label: '⏰ Recordatorios Automáticos de Citas' },
                              { key: 'winback', label: '🔄 Activación de Clientes Perdidos' },
                              { key: 'reviews', label: '⭐ Solicitud Automática Reseñas Google' },
                            ].map((item) => (
                              <div key={item.key} className="flex items-center justify-between bg-slate-950 px-4 py-2 rounded-xl border border-slate-800">
                                <span className="text-xs font-medium text-slate-200">{item.label}</span>
                                <input 
                                  type="checkbox" 
                                  checked={demoToggles[item.key]} 
                                  onChange={() => setDemoToggles({...demoToggles, [item.key]: !demoToggles[item.key]})}
                                  className="w-4 h-4 accent-indigo-600"
                                />
                              </div>
                            ))}
                          </div>
                        </div>

                        <button 
                          onClick={() => setActiveTab('voice_demo')}
                          className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-sm shadow-lg transition mt-4"
                        >
                          ¡Probar Agente de Voz en Reunión! 🎙️
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* SECCIÓN: DEMO AGENTE DE VOZ */}
                {activeTab === 'voice_demo' && (
                  <div className="space-y-6 max-w-3xl mx-auto">
                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl flex justify-between items-center">
                      <div>
                        <h2 className="text-xl font-bold text-white">Demo en Vivo: Agente de Voz Web</h2>
                        <p className="text-sm text-slate-300 mt-1">Simula la interacción del cliente en tiempo real.</p>
                      </div>
                      <span className="bg-indigo-600/20 text-indigo-400 px-3 py-1 rounded-full text-xs font-bold border border-indigo-500/30">
                        {demoProspect.businessName}
                      </span>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 p-8 rounded-2xl flex flex-col items-center justify-center space-y-6 text-center">
                      <div className={`w-28 h-28 rounded-full flex items-center justify-center text-4xl transition-all ${isRecording ? 'bg-red-600 animate-pulse shadow-xl shadow-red-600/50' : 'bg-indigo-600 shadow-xl shadow-indigo-600/40'}`}>
                        🎙️
                      </div>
                      <div>
                        <h3 className="text-lg font-bold text-white">
                          {isRecording ? "Escuchando voz del cliente..." : "Micrófono Listo"}
                        </h3>
                        <p className="text-xs text-slate-400 mt-1">Pulsa el botón para simular la llamada.</p>
                      </div>
                      <button 
                        onClick={simulateVoiceInteraction}
                        disabled={isRecording}
                        className="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl font-bold text-sm shadow-lg transition"
                      >
                        {isRecording ? "Procesando llamada..." : "Simular Conversación por Voz"}
                      </button>
                      <div className="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-left space-y-2 mt-4 max-h-48 overflow-y-auto">
                        {voiceLogs.map((log, index) => (
                          <div key={index} className="p-2.5 rounded-lg text-xs bg-slate-900 text-indigo-300 border border-slate-800">
                            {log.text}
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* DASHBOARD */}
                {activeTab === 'dashboard' && (
                  <div className="space-y-6 max-w-5xl mx-auto">
                    <h2 className="text-2xl font-bold text-white">Panel Super Admin (Agencia)</h2>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                      {[
                        { title: 'MRR Recurrente', value: '$2,450 USD', color: 'text-emerald-400' },
                        { title: 'Subcuentas', value: '14 Clientes', color: 'text-indigo-400' },
                        { title: 'Consumo IA', value: '$12.40 USD', color: 'text-amber-400' },
                        { title: 'Leads', value: '1,280', color: 'text-purple-400' },
                      ].map((stat, i) => (
                        <div key={i} className="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                          <p className="text-xs text-slate-400 uppercase">{stat.title}</p>
                          <h3 className={`text-2xl font-extrabold mt-1 ${stat.color}`}>{stat.value}</h3>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* SUBACCOUNTS */}
                {activeTab === 'subaccounts' && (
                  <div className="space-y-6 max-w-5xl mx-auto">
                    <h2 className="text-2xl font-bold text-white">Gestión de Clientes (Subcuentas)</h2>
                    <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-3">
                      <div className="flex justify-between items-center p-3 bg-slate-950 rounded-xl border border-slate-800">
                        <div>
                          <p className="font-bold text-white text-sm">{demoProspect.businessName}</p>
                          <p className="text-xs text-indigo-400">WhatsApp: {demoProspect.phone}</p>
                        </div>
                        <span className="bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full text-xs font-semibold">Demo Activa</span>
                      </div>
                    </div>
                  </div>
                )}

                {/* RESTO DE PESTAÑAS (AGENTS, KANBAN, INBOX, ETC) */}
                {['agents', 'advanced_agents', 'kanban', 'calendar', 'inbox', 'webbuilder', 'whatsapp_api', 'domains'].includes(activeTab) && (
                  <div className="space-y-6 max-w-5xl mx-auto text-center py-12">
                    <div className="bg-slate-900 border border-slate-800 p-8 rounded-2xl space-y-4">
                      <h2 className="text-2xl font-bold text-white capitalize">Módulo: {activeTab.replace('_', ' ')}</h2>
                      <p className="text-sm text-slate-400">Este módulo está configurado y sincronizado para operar con {demoProspect.businessName}.</p>
                      <button onClick={() => setActiveTab('demo_generator')} className="bg-indigo-600 text-white px-6 py-2.5 rounded-xl text-xs font-bold">
                        Volver a Demo Express 🚀
                      </button>
                    </div>
                  </div>
                )}

              </div>
            </main>
          </div>
        );
      }

      ReactDOM.render(<AgentiaConnect />, document.getElementById('root'));
    </script>
  </body>
</html>
