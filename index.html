<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentia Connect - SaaS Real</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
      function AgentiaConnect() {
        const [activeTab, setActiveTab] = React.useState('settings');
        
        // Configuración real de la API de OpenRouter
        const [openRouterKey, setOpenRouterKey] = React.useState(localStorage.getItem('or_key') || '');
        const [selectedModel, setSelectedModel] = React.useState('mistralai/mixtral-8x7b-instruct');
        
        const [demoProspect, setDemoProspect] = React.useState({
          businessName: 'Clínica Dental Sonrisas',
          industry: 'Salud y Estética Dental',
          phone: '+56 9 4444 5555',
        });

        const [chatInput, setChatInput] = React.useState('');
        const [messages, setMessages] = React.useState([
          { sender: 'ai', text: `¡Hola! Soy el agente IA real conectado a OpenRouter para ${demoProspect.businessName}. ¿En qué te puedo ayudar?` }
        ]);
        const [isCallingRealAPI, setIsCallingRealAPI] = React.useState(false);

        // Estado para el Agente de Voz Real (SpeechSynthesis y SpeechRecognition)
        const [voiceStatus, setVoiceStatus] = React.useState('Inactivo. Pulsa para hablar con el agente.');
        const [isListening, setIsListening] = React.useState(false);

        // Guardar API Key
        const handleSaveKey = (e) => {
          e.preventDefault();
          localStorage.setItem('or_key', openRouterKey);
          alert('¡Llave de OpenRouter guardada con éxito en tu navegador!');
        };

        // Función para hablar con la API real de OpenRouter
        const handleSendRealAI = async (e) => {
          e.preventDefault();
          if (!chatInput.trim()) return;
          if (!openRouterKey) {
            alert('Por favor, configura primero tu API Key de OpenRouter en la pestaña de Ajustes.');
            setActiveTab('settings');
            return;
          }

          const userMsg = chatInput;
          setMessages(prev => [...prev, { sender: 'user', text: userMsg }]);
          setChatInput('');
          setIsCallingRealAPI(true);

          try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${openRouterKey}`,
                "HTTP-Referer": window.location.origin,
                "X-Title": "Agentia Connect",
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                model: selectedModel,
                messages: [
                  { role: "system", content: `Eres el asistente de IA experto para el negocio ${demoProspect.businessName} del giro ${demoProspect.industry}. Responde de forma amable, comercial y orientada a agendar citas.` },
                  { role: "user", content: userMsg }
                ]
              })
            });

            const data = await response.json();
            const aiReply = data.choices && data.choices[0] ? data.choices[0].message.content : "Error al recibir respuesta de OpenRouter.";
            
            setMessages(prev => [...prev, { sender: 'ai', text: aiReply }]);
            
            // Si el agente de voz está activo, también reproducimos la respuesta en audio real
            speakText(aiReply);

          } catch (err) {
            setMessages(prev => [...prev, { sender: 'ai', text: `Error de conexión: ${err.message}` }]);
          } finally {
            setIsCallingRealAPI(false);
          }
        };

        // Función de Voz Real (Texto a Voz del navegador)
        const speakText = (text) => {
          if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            window.speechSynthesis.speak(utterance);
          }
        };

        // Reconocimiento de Voz Real del navegador
        const startRealVoiceAgent = () => {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SpeechRecognition) {
            alert('Tu navegador móvil no soporta reconocimiento de voz nativo. Usa Google Chrome.');
            return;
          }

          const recognition = new SpeechRecognition();
          recognition.lang = 'es-ES';
          recognition.interimResults = false;

          recognition.onstart = () => {
            setIsListening(true);
            setVoiceStatus('🎙️ Escuchando tu voz en tiempo real...');
          };

          recognition.onresult = async (event) => {
            const spokenText = event.results[0][0].transcript;
            setVoiceStatus(`🗣️ Dijiste: "${spokenText}" - Consultando a la IA...`);
            setIsListening(false);

            // Si hay llave, consultamos a OpenRouter con lo que habló el usuario
            if (openRouterKey) {
              try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                  method: "POST",
                  headers: {
                    "Authorization": `Bearer ${openRouterKey}`,
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    model: selectedModel,
                    messages: [
                      { role: "system", content: `Eres un agente de voz telefónico y web para ${demoProspect.businessName}. Responde breve y natural en español.` },
                      { role: "user", content: spokenText }
                    ]
                  })
                });
                const data = await response.json();
                const reply = data.choices[0].message.content;
                setVoiceStatus(`🤖 IA: ${reply}`);
                speakText(reply);
              } catch (e) {
                setVoiceStatus('Error conectando con IA de voz.');
              }
            } else {
              setVoiceStatus('Configura tu OpenRouter Key en Ajustes para activar la respuesta de voz inteligente.');
            }
          };

          recognition.onerror = () => {
            setIsListening(false);
            setVoiceStatus('Error al capturar audio. Intenta de nuevo.');
          };

          recognition.start();
        };

        return (
          <div className="flex h-screen bg-slate-950 text-slate-100 font-sans overflow-hidden">
            
            {/* SIDEBAR */}
            <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between hidden lg:flex">
              <div>
                <div className="p-6 border-b border-slate-800 flex items-center space-x-3">
                  <div className="bg-indigo-600 p-2 rounded-xl text-white font-black text-xl shadow-lg">AC</div>
                  <div>
                    <h1 className="font-bold text-lg text-white">Agentia Connect</h1>
                    <p className="text-xs text-indigo-400 font-medium">SaaS White-Label Real</p>
                  </div>
                </div>

                <nav className="p-4 space-y-1.5">
                  {[
                    { id: 'settings', label: '⚙️ 1. Configurar API OpenRouter' },
                    { id: 'demo_generator', label: '🚀 2. Datos del Negocio' },
                    { id: 'agents', label: '🤖 3. Chat IA en Vivo (Real)' },
                    { id: 'voice_demo', label: '🎙️ 4. Agente de Voz Real' },
                  ].map(item => (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`w-full flex items-center space-x-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${
                        activeTab === item.id 
                          ? 'bg-indigo-600 text-white shadow-md' 
                          : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                      }`}
                    >
                      <span>{item.label}</span>
                    </button>
                  ))}
                </nav>
              </div>

              <div className="p-4 border-t border-slate-800">
                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                  <p className="text-xs text-slate-400">Estado API Key:</p>
                  <p className={`text-xs font-bold mt-1 ${openRouterKey ? 'text-emerald-400' : 'text-amber-400'}`}>
                    {openRouterKey ? '✔ Configurada y Lista' : '⚠ Falta Configurar Key'}
                  </p>
                </div>
              </div>
            </aside>

            {/* MAIN CONTENT */}
            <main className="flex-1 flex flex-col overflow-hidden bg-slate-950">
              
              <header className="h-16 bg-slate-900 border-b border-slate-800 px-6 flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <span className="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full font-semibold border border-emerald-500/30">
                    Sistema Operativo Real
                  </span>
                  <span className="text-sm font-medium text-slate-300">Negocio: <strong className="text-white">{demoProspect.businessName}</strong></span>
                </div>
              </header>

              {/* SELECTOR MÓVIL */}
              <div className="bg-slate-900 border-b border-slate-800 p-3 lg:hidden flex space-x-2 overflow-x-auto">
                <button onClick={() => setActiveTab('settings')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'settings' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300'}`}>⚙️ Ajustes API</button>
                <button onClick={() => setActiveTab('demo_generator')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'demo_generator' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300'}`}>🚀 Negocio</button>
                <button onClick={() => setActiveTab('agents')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'agents' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300'}`}>🤖 Chat IA</button>
                <button onClick={() => setActiveTab('voice_demo')} className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap ${activeTab === 'voice_demo' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300'}`}>🎙️ Voz Real</button>
              </div>

              <div className="flex-1 overflow-y-auto p-6">

                {/* SECCIÓN 1: AJUSTES API OPENROUTER */}
                {activeTab === 'settings' && (
                  <div className="space-y-6 max-w-2xl mx-auto bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                    <h2 className="text-xl font-bold text-white">⚙️ Configuración de tu API Key de OpenRouter</h2>
                    <p className="text-sm text-slate-300">
                      Para que la IA responda de verdad en tus demostraciones y cierres de venta, introduce tu clave de OpenRouter aquí. Se guarda de forma segura en tu navegador.
                    </p>

                    <form onSubmit={handleSaveKey} className="space-y-4">
                      <div>
                        <label className="text-xs text-slate-400 font-semibold uppercase">OpenRouter API Key</label>
                        <input 
                          type="password" 
                          placeholder="sk-or-v1-..."
                          value={openRouterKey}
                          onChange={e => setOpenRouterKey(e.target.value)}
                          className="w-full mt-2 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 font-mono"
                        />
                      </div>

                      <div>
                        <label className="text-xs text-slate-400 font-semibold uppercase">Modelo de IA</label>
                        <select 
                          value={selectedModel}
                          onChange={e => setSelectedModel(e.target.value)}
                          className="w-full mt-2 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                        >
                          <option value="mistralai/mixtral-8x7b-instruct">Mistral Mixtral 8x7B (Rápido y Excelente)</option>
                          <option value="openai/gpt-4o-mini">GPT-4o Mini (OpenAI)</option>
                          <option value="anthropic/claude-3-haiku">Claude 3 Haiku (Anthropic)</option>
                        </select>
                      </div>

                      <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-sm shadow-lg transition">
                        Guardar Llave API 💾
                      </button>
                    </form>
                  </div>
                )}

                {/* SECCIÓN 2: DATOS DEL NEGOCIO */}
                {activeTab === 'demo_generator' && (
                  <div className="space-y-6 max-w-2xl mx-auto bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                    <h2 className="text-xl font-bold text-white">🚀 Datos del Negocio para la Demo</h2>
                    <div className="space-y-4">
                      <div>
                        <label className="text-xs text-slate-400 font-semibold uppercase">Nombre del Negocio</label>
                        <input 
                          type="text" 
                          value={demoProspect.businessName}
                          onChange={e => setDemoProspect({...demoProspect, businessName: e.target.value})}
                          className="w-full mt-2 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:border-indigo-500"
                        />
                      </div>
                      <div>
                        <label className="text-xs text-slate-400 font-semibold uppercase">Giro / Industria</label>
                        <input 
                          type="text" 
                          value={demoProspect.industry}
                          onChange={e => setDemoProspect({...demoProspect, industry: e.target.value})}
                          className="w-full mt-2 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:border-indigo-500"
                        />
                      </div>
                      <button onClick={() => setActiveTab('agents')} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-sm shadow-lg transition">
                        Ir al Chat IA Real 🤖
                      </button>
                    </div>
                  </div>
                )}

                {/* SECCIÓN 3: CHAT IA REAL */}
                {activeTab === 'agents' && (
                  <div className="space-y-4 max-w-3xl mx-auto bg-slate-900 border border-slate-800 p-6 rounded-2xl flex flex-col h-[70vh]">
                    <h2 className="text-xl font-bold text-white">🤖 Chatbot IA en Vivo (Conectado a OpenRouter)</h2>
                    
                    <div className="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-4 overflow-y-auto space-y-3">
                      {messages.map((m, idx) => (
                        <div key={idx} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                          <div className={`max-w-[85%] p-3 rounded-xl text-sm ${m.sender === 'user' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-200'}`}>
                            {m.text}
                          </div>
                        </div>
                      ))}
                      {isCallingRealAPI && (
                        <div className="text-xs text-indigo-400 animate-pulse">La IA está pensando su respuesta real...</div>
                      )}
                    </div>

                    <form onSubmit={handleSendRealAI} className="flex space-x-2">
                      <input 
                        type="text" 
                        value={chatInput}
                        onChange={e => setChatInput(e.target.value)}
                        placeholder="Escribe como cliente interesado..."
                        className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                      />
                      <button type="submit" disabled={isCallingRealAPI} className="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-xl font-bold text-sm">
                        Enviar 🚀
                      </button>
                    </form>
                  </div>
                )}

                {/* SECCIÓN 4: AGENTE DE VOZ REAL */}
                {activeTab === 'voice_demo' && (
                  <div className="space-y-6 max-w-2xl mx-auto bg-slate-900 border border-slate-800 p-8 rounded-2xl text-center">
                    <h2 className="text-xl font-bold text-white">🎙️ Agente de Voz Interactivo Real</h2>
                    <p className="text-sm text-slate-300">Haz clic en el botón, habla por el micrófono de tu celular y la IA te responderá con voz real.</p>
                    
                    <div className={`w-32 h-32 mx-auto rounded-full flex items-center justify-center text-4xl shadow-2xl transition-all ${isListening ? 'bg-red-600 animate-pulse shadow-red-600/50' : 'bg-indigo-600 shadow-indigo-600/40'}`}>
                      🎙️
                    </div>

                    <button 
                      onClick={startRealVoiceAgent}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3.5 rounded-xl font-bold text-sm shadow-lg transition"
                    >
                      {isListening ? "Escuchando..." : "Hablar con el Agente de Voz 🗣️"}
                    </button>

                    <div className="bg-slate-950 border border-slate-800 p-4 rounded-xl text-left text-xs text-indigo-300 font-medium">
                      {voiceStatus}
                    </div>
                  </div>
                )}

              </div>
            </main>
          </div>
        );
      }

      ReactDOM.render(<AgentiaConnect />, document.getElementById('root'));
    </script>
  </body>
</html>
